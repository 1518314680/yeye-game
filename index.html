    <style>
        :root {
            --bg-1: #fffafb;
            --bg-2: #fff1f6;
            --bg-3: #ffe1ec;
            --panel: rgba(255, 255, 255, 0.78);
            --panel-strong: rgba(255, 247, 251, 0.94);
            --pink: #f28ab2;
            --pink-deep: #df5f95;
            --rose: #ffbfd5;
            --text: #7a4761;
            --text-soft: #9f6f86;
            --line: rgba(242, 138, 178, 0.28);
            --shadow: rgba(231, 143, 177, 0.24);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Baloo 2", "Microsoft YaHei", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), transparent 35%),
                radial-gradient(circle at top right, rgba(255, 214, 230, 0.92), transparent 30%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 18% 22%, rgba(255, 195, 220, 0.55) 0%, transparent 36%),
                radial-gradient(circle at 85% 18%, rgba(255, 228, 239, 0.85) 0%, transparent 30%),
                radial-gradient(circle at 50% 82%, rgba(250, 176, 205, 0.35) 0%, transparent 34%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.9) 0 10px, transparent 11px),
                radial-gradient(circle at 78% 26%, rgba(255, 233, 241, 0.85) 0 8px, transparent 9px),
                radial-gradient(circle at 72% 76%, rgba(255, 255, 255, 0.75) 0 12px, transparent 13px),
                radial-gradient(circle at 25% 74%, rgba(255, 224, 235, 0.9) 0 7px, transparent 8px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
            animation: floatDots 14s linear infinite;
        }

        @keyframes floatDots {
            0% { transform: translateY(0); }
            50% { transform: translateY(12px); }
            100% { transform: translateY(0); }
        }

        .bg-image {
            width: 100%;
            max-width: 1400px;
            height: auto;
            display: block;
            margin: 0 auto 20px;
            border-radius: 24px;
            box-shadow: 
                0 24px 60px rgba(223, 95, 149, 0.18),
                0 10px 30px rgba(255, 255, 255, 0.7);
            border: 4px solid rgba(255, 255, 255, 0.72);
            position: relative;
            z-index: 2;
        }

        .container {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 244, 249, 0.95));
            border-radius: 32px;
            padding: 40px;
            box-shadow: 
                0 30px 70px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            max-width: 1400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.95);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(18px);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(255, 255, 255, 0.8),
                rgba(255, 202, 224, 0.9),
                rgba(242, 138, 178, 0.65),
                rgba(255, 255, 255, 0.8));
            border-radius: 32px;
            z-index: -1;
            opacity: 0.5;
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.8; }
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(90deg, #df5f95, #f28ab2, #ffb8cf, #df5f95);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 3px;
            animation: titleGlow 3s ease-in-out infinite, titleSlide 8s linear infinite;
            filter: drop-shadow(0 8px 20px rgba(242, 138, 178, 0.25));
            position: relative;
        }

        @keyframes titleGlow {
            0%, 100% {
                filter: drop-shadow(0 8px 20px rgba(242, 138, 178, 0.22))
                        drop-shadow(0 0 18px rgba(255, 210, 227, 0.7));
            }
            50% {
                filter: drop-shadow(0 10px 24px rgba(223, 95, 149, 0.28))
                        drop-shadow(0 0 22px rgba(255, 203, 223, 0.9));
            }
        }

        @keyframes titleSlide {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-size: 24px;
            color: var(--text-soft);
            font-weight: bold;
            text-shadow: 0 4px 16px rgba(255, 212, 228, 0.95);
            letter-spacing: 2px;
            animation: subtitlePulse 3s ease-in-out infinite;
        }

        @keyframes subtitlePulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .image-menu-section {
            margin-top: 36px;
            padding-top: 32px;
            border-top: 1px dashed rgba(242, 138, 178, 0.38);
        }

        .menu-group {
            margin-bottom: 28px;
        }

        .menu-group:last-child {

        }

        .image-menu-title {

            font-size: 26px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 5px 14px rgba(255, 213, 229, 0.95);
        }

        .image-menu-tabs,

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .image-menu-tabs {
            margin-bottom: 18px;
        }

        .image-button-list {
            margin-bottom: 22px;
        }

        .image-menu-tabs.horizontal-tabs {
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .image-menu-tabs.image-switch-tabs {
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .image-switch-tabs {
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .image-menu-tabs.horizontal-tabs::-webkit-scrollbar {
            height: 8px;
        }

        .image-menu-tabs.horizontal-tabs::-webkit-scrollbar-thumb {

        }

        .image-menu-tab,

            font-weight: 700;

        .image-menu-tab {
            padding: 0 20px;
            font-size: 16px;
        }

        .image-button {
            padding: 0 14px;
            font-size: 14px;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .image-menu-tab:hover,

            border-color: rgba(242, 138, 178, 0.9);

            box-shadow:

        .image-preview {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 16px;
            border: 1px solid rgba(255, 209, 225, 0.92);
            border-radius: 20px;
            background: rgba(255, 251, 253, 0.94);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
        }

        .image-preview:empty {
            display: none;
        }

        .image-preview.image-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }

        .image-preview.image-single {
            justify-content: stretch;
            align-items: stretch;
        }

        .menu-preview-image {
            display: block;
            max-width: 100%;
            max-height: none;
            width: 100%;
            height: auto;
            cursor: zoom-in;
            border-radius: 14px;
            box-shadow:
                0 18px 36px rgba(223, 95, 149, 0.18),
                0 8px 20px rgba(255, 255, 255, 0.9);
            transition: max-width 0.2s ease, max-height 0.2s ease;
        }

        .menu-preview-image.is-original {
            max-width: none;
            max-height: none;
            cursor: zoom-in;
        }

        .fullscreen-viewer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 0;
            background: rgba(121, 73, 97, 0.82);
            touch-action: none;
        }

        .fullscreen-viewer.active {
            display: flex;
        }

        .fullscreen-viewer img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            margin: auto;
            cursor: zoom-out;
            user-select: none;
            -webkit-user-drag: none;
        }

        .viewer-stage {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: safe center;
            justify-content: safe center;
            overflow: auto;
            overscroll-behavior: contain;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed rgba(242, 138, 178, 0.38);
            color: var(--text-soft);
            font-size: 12px;
        }

        .disclaimer {
            margin-top: 14px;
            color: rgba(159, 111, 134, 0.88);
            font-size: 12px;
            line-height: 1.7;
        }

        .disclaimer-toggle {
            margin-top: 14px;
            border: 0;
            background: transparent;
            color: var(--pink-deep);
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .disclaimer-toggle:hover {
            color: #c95085;
        }

        .disclaimer-content {
            display: none;
        }

        .disclaimer-content.show {
            display: block;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .bg-image {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .bg-image {
                margin-bottom: 15px;
                border-radius: 18px;
            }
            
            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 18px;
            }

            .container {
                padding: 25px;
            }

            .image-menu-title {
                font-size: 22px;
            }

            .image-menu-tab {
                width: 100%;
            }

            .image-preview {
                padding: 10px;
            }
        }
    </style>
</head>

        const homeMenuListEl = document.getElementById('homeMenuList');
        const playButtonListEl = document.getElementById('playButtonList');
        const imageButtonListEl = document.getElementById('imageButtonList');
        const playImagePreviewEl = document.getElementById('playImagePreview');
        const disclaimerToggleEl = document.getElementById('disclaimerToggle');
        const disclaimerContentEl = document.getElementById('disclaimerContent');
        const fullscreenViewerEl = document.getElementById('fullscreenViewer');
        let viewerScale = 1;
        let pinchDistance = 0;

        function closeViewer() {
            fullscreenViewerEl.classList.remove('active');
            fullscreenViewerEl.innerHTML = '';
            document.body.style.overflow = '';
            viewerScale = 1;
            pinchDistance = 0;
        }

        function openViewer(sourceImage) {
            viewerScale = 1;
            fullscreenViewerEl.innerHTML = `
                <div class="viewer-stage">
                    <img src="${sourceImage.src}" alt="${sourceImage.alt}">
                </div>`;
            fullscreenViewerEl.classList.add('active');
            document.body.style.overflow = 'hidden';

            const viewerImage = fullscreenViewerEl.querySelector('img');
            let baseWidth = 0;
            let baseHeight = 0;

            const captureBaseSize = () => {
                if (baseWidth) return;
                baseWidth = viewerImage.clientWidth;
                baseHeight = viewerImage.clientHeight;
            };

            const setScale = (scale) => {
                captureBaseSize();
                if (!baseWidth) return;
                viewerScale = Math.min(5, Math.max(0.5, scale));
                viewerImage.style.maxWidth = 'none';
                viewerImage.style.maxHeight = 'none';
                viewerImage.style.width = `${baseWidth * viewerScale}px`;
                viewerImage.style.height = `${baseHeight * viewerScale}px`;
            };

            if (viewerImage.complete) {
                requestAnimationFrame(captureBaseSize);
            } else {
                viewerImage.addEventListener('load', captureBaseSize, { once: true });
            }

            viewerImage.addEventListener('click', closeViewer);
            fullscreenViewerEl.onwheel = (event) => {
                event.preventDefault();
                setScale(viewerScale + (event.deltaY < 0 ? 0.2 : -0.2));
            };
            fullscreenViewerEl.ontouchstart = (event) => {
                if (event.touches.length === 2) {
                    pinchDistance = Math.hypot(
                        event.touches[0].clientX - event.touches[1].clientX,
                        event.touches[0].clientY - event.touches[1].clientY
                    );
                }
            };
            fullscreenViewerEl.ontouchmove = (event) => {
                if (event.touches.length !== 2 || !pinchDistance) return;
                event.preventDefault();
                const nextDistance = Math.hypot(
                    event.touches[0].clientX - event.touches[1].clientX,
                    event.touches[0].clientY - event.touches[1].clientY
                );
                setScale(viewerScale * (nextDistance / pinchDistance));
                pinchDistance = nextDistance;
            };
        }

        homeMenus.forEach((menu) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'image-menu-tab';
            button.textContent = menu.name;
            button.addEventListener('click', () => location.href = menu.url);

        function renderPreview(menuName, imageIndex = 0) {
            const currentMenu = playMenus.find((menu) => menu.name === menuName) || playMenus[0];
            playImagePreviewEl.innerHTML = '';
            playImagePreviewEl.className = 'image-preview image-single';

            const image = document.createElement('img');
            image.src = currentMenu.images[imageIndex]?.src || currentMenu.images[0]?.src || '';
            image.alt = `${currentMenu.name}-${imageIndex + 1}`;
            image.className = 'menu-preview-image is-original';
            image.title = '点击全屏查看';
            image.addEventListener('click', () => openViewer(image));
            playImagePreviewEl.appendChild(image);

            playButtonListEl.querySelectorAll('button').forEach((button) => {
                button.classList.toggle('active', button.dataset.menuName === currentMenu.name);
            });

            imageButtonListEl.innerHTML = '';
            currentMenu.images.forEach((imageItem, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'image-button';
                button.dataset.imageIndex = String(index);
                button.textContent = imageItem.label || `图${index + 1}`;
                button.addEventListener('click', () => renderPreview(currentMenu.name, index));
                imageButtonListEl.appendChild(button);
            });

            imageButtonListEl.querySelectorAll('button').forEach((button) => {
                button.classList.toggle('active', Number(button.dataset.imageIndex) === imageIndex);
            });
        }

        playMenus.forEach((menu) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'image-menu-tab';
            button.dataset.menuName = menu.name;
            button.textContent = menu.name;
            button.addEventListener('click', () => renderPreview(menu.name, 0));
            playButtonListEl.appendChild(button);
        });

        renderPreview(playMenus[0].name);
        disclaimerToggleEl.addEventListener('click', () => disclaimerContentEl.classList.toggle('show'));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && fullscreenViewerEl.classList.contains('active')) closeViewer();
        });
    </script>
</body>
</html>
