# 椰椰电竞小游戏 - Nginx 站点配置
# 监听端口 9999，静态站点
limit_req_zone $binary_remote_addr zone=lottery_draws:10m rate=10r/m;

server {
    listen 9999;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lottery_api http://lottery-api:8000;

    location = /api/lottery/draw {
        limit_req zone=lottery_draws burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $lottery_api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/lottery/prizes {
        proxy_pass $lottery_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/lottery/record {
        limit_req zone=lottery_draws burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $lottery_api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /lottery.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 根路径直接跳转到游戏合集
    location = / {
        return 302 /yeye-game/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 源码和部署文件不属于公开静态站点内容。
    location ^~ /lottery_backend/ { return 404; }
    location ^~ /deploy/ { return 404; }
    location ^~ /data/ { return 404; }
    location ~ (^|/)\. { return 404; }

    # 静态资源缓存
    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 可选：关闭访问日志
    # access_log off;
    error_log /var/log/nginx/yeye_error.log warn;
}
